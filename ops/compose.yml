name: huahaiatlas
services:
  kuma:
    image: ghcr.io/louislam/uptime-kuma:2-slim@sha256:a8698e0664a36bcedba4efa5ed745c5b2aaa6488d2d8e866b5f054c8b19ad84b
    restart: unless-stopped
    network_mode: host
    environment:
      UPTIME_KUMA_HOST: 127.0.0.1
      UPTIME_KUMA_PORT: '3001'
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - ./data:/app/data
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
