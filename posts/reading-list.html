    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="返回首页">
        <img src="https://github.com/Sunhuahai.png" alt="" />

      <nav aria-label="主导航">
        <a href="../index.html#posts">文章</a>

      <button class="theme-toggle" type="button" aria-label="切换深浅色主题">
        <span aria-hidden="true">◐</span>

    <main class="post-page">
      <article class="post-article">
        <a class="back-link" href="../index.html#posts">← 返回文章列表</a>
        <p class="eyebrow">Reading</p>
        <h1>近期阅读清单</h1>
        <div class="post-meta">
          <time datetime="2026-05-18">2026-05-18</time>
          <span>2 分钟阅读</span>
        </div>
        <img
          class="post-cover"
          src="https://images.unsplash.com/photo-1519682337058-a94d519337bc?auto=format&fit=crop&w=1400&q=82"
          alt="打开的书和咖啡"
        />

        <p>
          阅读清单不是为了制造压力，而是记录一段时间里自己在意的问题。它可以很短，但最好能说明为什么这些书值得被放在一起。
        </p>

        <h2>暂定主题</h2>
        <p>
          近期会优先关注工具、系统设计、历史叙事和个人知识管理。不同主题之间的交叉点，往往比单独一本书更有启发。
        </p>

        <h2>记录方式</h2>
        <p>
          每本书只保留三个部分：核心问题、最有价值的一段推理、对自己当前项目的影响。这样笔记更容易被再次使用。
        </p>
      </article>
    </main>
  </body>
