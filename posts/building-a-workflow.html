        <h1>把工具打磨成工作流</h1>
        <div class="post-meta">
          <time datetime="2026-06-24">2026-06-24</time>
          <span>4 分钟阅读</span>
        </div>

        <p>
          工具越多，越容易把注意力花在切换和配置上。真正能留下价值的不是某个工具，而是一套能反复执行的工作流。
        </p>

        <p>
          一个好的工作流通常具备三个特征：输入清楚，处理过程可追踪，输出能被复用。少一个环节，时间久了都会变成临时补丁。
        </p>

        <h2>减少选择成本</h2>
        <p>
          当任务重复出现时，应该让工具承担固定步骤，让人只处理判断和取舍。这样才能减少上下文切换，让注意力停在问题本身。
        </p>

        <h2>保留复盘入口</h2>
        <p>
          工作流需要留下痕迹。命令、配置、失败原因和最终结果都应该能被找到，否则下一次仍然会重新摸索。
        </p>
      </article>
